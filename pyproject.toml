[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "micropki"
version = "1.0.0"
description = "MicroPKI Utility - Инфраструктура открытых ключей"
requires-python = ">=3.8"
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
micropki = "micropki.cli:main"

[tool.pytest.ini_options]
markers = [
    "perf: slow performance tests that issue or validate large certificate batches",
]
